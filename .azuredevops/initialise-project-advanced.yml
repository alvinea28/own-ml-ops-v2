# Optional upstream generator. Use initialise-project.yml for the repaired taxi.
trigger: none

name: Initialize upstream project ${{ parameters.repoName }}

parameters:
  - name: adoProjectName
    displayName: Azure DevOps project containing the repositories
    type: string

  - name: repoName
    displayName: New project repository (must already exist)
    type: string

  - name: mlOpsProjectRepoName
    displayName: Upstream source template repository (already imported)
    type: string
    default: mlops-project-template

  - name: projectType
    displayName: Upstream ML project type
    type: string
    default: classical
    values:
      - classical
      - cv
      - nlp

  - name: mlopsVersion
    displayName: Upstream MLOps interface
    type: string
    default: aml-cli-v2
    values:
      - aml-cli-v2
      - python-sdk-v2
      - rai-aml-cli-v2

  - name: infrastructure_version
    displayName: Upstream infrastructure provider
    type: string
    default: bicep
    values:
      - bicep
      - terraform

stages:
  - stage: InitialiseProject
    displayName: Initialise upstream project
    jobs:
      - job: InitialiseProjectJob
        displayName: Checkout repos, initialise your new one and create pipelines
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            path: s/accelerator
            persistCredentials: false
          - checkout: git://${{ parameters.adoProjectName }}/${{ parameters.mlOpsProjectRepoName }}@refs/heads/main
            path: s/project-template
            persistCredentials: false
          - checkout: git://${{ parameters.adoProjectName }}/${{ parameters.repoName }}
            path: s/target
            fetchDepth: 0
            persistCredentials: true

          - task: Bash@3
            displayName: Run script to initialise your repo
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/s
              script: |
                bash "$ACCELERATOR_ROOT/.azuredevops/scripts/initialise_repo.sh" \
                  "$TARGET_DIRECTORY" "$PROJECT_TYPE" "$MLOPS_VERSION" \
                  "$TEMPLATE_DIRECTORY" "$INFRASTRUCTURE_VERSION" "$TEMPLATE_LAYOUT"
            env:
              ACCELERATOR_ROOT: $(Pipeline.Workspace)/s/accelerator
              TARGET_DIRECTORY: $(Pipeline.Workspace)/s/target
              TEMPLATE_DIRECTORY: $(Pipeline.Workspace)/s/project-template
              PROJECT_TYPE: ${{ parameters.projectType }}
              MLOPS_VERSION: ${{ parameters.mlopsVersion }}
              INFRASTRUCTURE_VERSION: ${{ parameters.infrastructure_version }}
              TEMPLATE_LAYOUT: accelerator

          - task: Bash@3
            displayName: Run script to create pipelines in ADO
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/s
              script: |
                bash "$ACCELERATOR_ROOT/.azuredevops/scripts/create_ado_pipelines.sh" \
                  "$TARGET_REPOSITORY" "$ADO_PROJECT" "$TARGET_DIRECTORY"
            env:
              ACCELERATOR_ROOT: $(Pipeline.Workspace)/s/accelerator
              TARGET_DIRECTORY: $(Pipeline.Workspace)/s/target
              TARGET_REPOSITORY: ${{ parameters.repoName }}
              ADO_PROJECT: ${{ parameters.adoProjectName }}
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
