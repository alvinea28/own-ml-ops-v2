trigger: none

name: Initialize ${{ parameters.repoName }} repo

parameters:
  - name: adoProjectName
    displayName: Azure DevOps Project Name
    type: string

  - name: repoName
    displayName: New Project Repository Name
    type: string

  - name: useRepairedTaxiTemplate
    displayName: Use repaired taxi template for classical / AML CLI v2 / Bicep
    type: boolean
    default: true

  # Import https://github.com/alvinea28/taxi-fare-regression into Azure Repos
  # under this DISTINCT name. Never use the working application as the source/target.
  - name: taxiTemplateRepoName
    displayName: Repaired taxi template Azure Repos name
    type: string
    default: taxi-fare-regression-template

  - name: mlOpsProjectRepoName
    displayName: Upstream template Azure Repos name (other scenarios)
    type: string
    default: mlops-project-template

  - name: projectType
    displayName: ML Project Type
    type: string
    default: classical
    values:
      - classical
      - cv
      - nlp

  - name: mlopsVersion
    displayName: MLOps Interface
    type: string
    default: aml-cli-v2
    values:
      - aml-cli-v2
      - python-sdk-v2
      - rai-aml-cli-v2

  - name: infrastructure_version
    displayName: Infrastructure Provider
    type: string
    default: bicep
    values:
      - bicep
      - terraform

variables:
  ${{ if and(eq(parameters.useRepairedTaxiTemplate, true), eq(parameters.projectType, 'classical'), eq(parameters.mlopsVersion, 'aml-cli-v2'), eq(parameters.infrastructure_version, 'bicep')) }}:
    templateRepoName: ${{ parameters.taxiTemplateRepoName }}
    templateLayout: standalone
  ${{ else }}:
    templateRepoName: ${{ parameters.mlOpsProjectRepoName }}
    templateLayout: accelerator

stages:
  - stage: InitialiseProject
    displayName: Initialise Project
    jobs:
      - job: InitialiseProjectJob
        displayName: Checkout repos, initialise your new one and create pipelines
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            path: s/accelerator
            persistCredentials: false
          - checkout: git://${{ parameters.adoProjectName }}/${{ variables.templateRepoName }}@refs/heads/main
            path: s/project-template
            persistCredentials: false
          - checkout: git://${{ parameters.adoProjectName }}/${{ parameters.repoName }}
            path: s/target
            fetchDepth: 0
            persistCredentials: true

          - task: Bash@3
            displayName: Run script to initialise your repo
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/s
              script: |
                bash "$ACCELERATOR_ROOT/.azuredevops/scripts/initialise_repo.sh" \
                  "$TARGET_DIRECTORY" "$PROJECT_TYPE" "$MLOPS_VERSION" \
                  "$TEMPLATE_DIRECTORY" "$INFRASTRUCTURE_VERSION" "$TEMPLATE_LAYOUT"
            env:
              ACCELERATOR_ROOT: $(Pipeline.Workspace)/s/accelerator
              TARGET_DIRECTORY: $(Pipeline.Workspace)/s/target
              TEMPLATE_DIRECTORY: $(Pipeline.Workspace)/s/project-template
              PROJECT_TYPE: ${{ parameters.projectType }}
              MLOPS_VERSION: ${{ parameters.mlopsVersion }}
              INFRASTRUCTURE_VERSION: ${{ parameters.infrastructure_version }}
              TEMPLATE_LAYOUT: ${{ variables.templateLayout }}

          - task: Bash@3
            displayName: Run script to create pipelines in ADO
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/s
              script: |
                bash "$ACCELERATOR_ROOT/.azuredevops/scripts/create_ado_pipelines.sh" \
                  "$TARGET_REPOSITORY" "$ADO_PROJECT" "$TARGET_DIRECTORY"
            env:
              ACCELERATOR_ROOT: $(Pipeline.Workspace)/s/accelerator
              TARGET_DIRECTORY: $(Pipeline.Workspace)/s/target
              TARGET_REPOSITORY: ${{ parameters.repoName }}
              ADO_PROJECT: ${{ parameters.adoProjectName }}
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
