trigger: none

name: Initialize taxi project ${{ parameters.repoName }}

parameters:
  - name: adoProjectName
    displayName: Azure DevOps project containing the repositories
    type: string

  - name: repoName
    displayName: New taxi project repository (must already exist)
    type: string

  # Import https://github.com/alvinea28/taxi-fare-regression into Azure Repos
  # under this DISTINCT name. Never use the working application as the source/target.
  # This repository must exist in adoProjectName before queueing: Azure DevOps
  # validates checkout references before scripts run. A default name does not create it.
  - name: taxiTemplateRepoName
    displayName: Source template repository (already imported)
    type: string
    default: taxi-fare-regression-template

stages:
  - stage: InitialiseProject
    displayName: Initialise Project
    jobs:
      - job: InitialiseProjectJob
        displayName: Checkout repos, initialise your new one and create pipelines
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
            path: s/accelerator
            persistCredentials: false
          - checkout: git://${{ parameters.adoProjectName }}/${{ parameters.taxiTemplateRepoName }}@refs/heads/main
            path: s/project-template
            persistCredentials: false
          - checkout: git://${{ parameters.adoProjectName }}/${{ parameters.repoName }}
            path: s/target
            fetchDepth: 0
            persistCredentials: true

          - task: Bash@3
            displayName: Run script to initialise your repo
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/s
              script: |
                bash "$ACCELERATOR_ROOT/.azuredevops/scripts/initialise_repo.sh" \
                  "$TARGET_DIRECTORY" "$PROJECT_TYPE" "$MLOPS_VERSION" \
                  "$TEMPLATE_DIRECTORY" "$INFRASTRUCTURE_VERSION" "$TEMPLATE_LAYOUT"
            env:
              ACCELERATOR_ROOT: $(Pipeline.Workspace)/s/accelerator
              TARGET_DIRECTORY: $(Pipeline.Workspace)/s/target
              TEMPLATE_DIRECTORY: $(Pipeline.Workspace)/s/project-template
              PROJECT_TYPE: classical
              MLOPS_VERSION: aml-cli-v2
              INFRASTRUCTURE_VERSION: bicep
              TEMPLATE_LAYOUT: standalone

          - task: Bash@3
            displayName: Run script to create pipelines in ADO
            inputs:
              targetType: inline
              workingDirectory: $(Pipeline.Workspace)/s
              script: |
                bash "$ACCELERATOR_ROOT/.azuredevops/scripts/create_ado_pipelines.sh" \
                  "$TARGET_REPOSITORY" "$ADO_PROJECT" "$TARGET_DIRECTORY"
            env:
              ACCELERATOR_ROOT: $(Pipeline.Workspace)/s/accelerator
              TARGET_DIRECTORY: $(Pipeline.Workspace)/s/target
              TARGET_REPOSITORY: ${{ parameters.repoName }}
              ADO_PROJECT: ${{ parameters.adoProjectName }}
              AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
